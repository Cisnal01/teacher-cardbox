<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher CardBox</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3efe5;
}

header {
    background: #284b63;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
}

#tabs {
    display: flex;
    overflow-x: auto;
    background: white;
    border-bottom: 1px solid #ddd;
}

#tabs button {
    padding: 12px;
    border: none;
    background: white;
    cursor: pointer;
}

#tabs button.active {
    background: #284b63;
    color: white;
}

.controls {
    padding: 10px;
}

.controls button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #284b63;
    color: white;
    cursor: pointer;
}

#cards {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(300px,1fr));
    gap: 15px;
    padding: 15px;
}

.card {
    background: #fffef9;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
    border-left: 8px solid #888;
}

.yellow { border-left-color:#d4a017; }
.blue { border-left-color:#1976d2; }
.green { border-left-color:#2e7d32; }
.purple { border-left-color:#7b1fa2; }
.red { border-left-color:#c62828; }

.card h3 {
    margin-top: 0;
}

.actions {
    margin-top: 15px;
}

.actions button {
    margin-right: 5px;
}

dialog {
    border: none;
    border-radius: 10px;
    width: min(90%,500px);
}

dialog form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input,
select,
textarea {
    padding: 8px;
    font-size: 16px;
}
</style>
</head>

<body>

<header>📇 Teacher CardBox</header>

<div id="tabs"></div>

<div class="controls">
    <button
